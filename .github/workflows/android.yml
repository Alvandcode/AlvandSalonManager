name: Build and Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK (preinstalled on runner)
        shell: bash
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH" >> "$GITHUB_ENV"
          which sdkmanager || true
          sdkmanager --version || true

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Read base version
        id: version
        shell: bash
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          RELEASE_VERSION="${VERSION}.${GITHUB_RUN_NUMBER}"
          VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))
          echo "base=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Version: $RELEASE_VERSION ($VERSION_CODE)"

      - name: Apply release version
        shell: bash
        run: |
          sed -i -E "s/versionCode = [0-9]+/versionCode = ${{ steps.version.outputs.code }}/" app/build.gradle.kts
          sed -i -E "s/versionName = \"[^\"]+\"/versionName = \"${{ steps.version.outputs.release }}\"/" app/build.gradle.kts
          grep -nE 'versionCode|versionName' app/build.gradle.kts

      - name: Decode release signing key
        shell: bash
        run: |
          echo "${{ secrets.RELEASE_SIGNING_KEYSTORE_B64 }}" | base64 -d > release-keystore.jks
          test -s release-keystore.jks

      - name: Build signed release APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Name APK with app and version
        shell: bash
        run: |
          mkdir -p release-files
          cp app/build/outputs/apk/release/app-release.apk \
            "release-files/AlvandSalonManager-v${{ steps.version.outputs.release }}-Android.apk"
          ls -lh release-files

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlvandSalonManager-v${{ steps.version.outputs.release }}
          path: release-files/*.apk
          if-no-files-found: error

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.release }}
          name: Alvand Salon Manager v${{ steps.version.outputs.release }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            ## Alvand Salon Manager v${{ steps.version.outputs.release }}

            فایل نصب: `AlvandSalonManager-v${{ steps.version.outputs.release }}-Android.apk`

            ### نصب
            - اگر نسخه قبلی با امضای متفاوت روی گوشی نصب است، ابتدا آن را حذف کنید و سپس این نسخه را نصب کنید.
            - حداقل نسخه اندروید: ۹ (API 28)

            ### ویژگی‌های جدید
            - رابط دوزبانه فارسی/انگلیسی با دکمه تغییر زبان در سربرگ
            - تغییر خودکار چیدمان راست‌به‌چپ/چپ‌به‌راست و بومی‌سازی اعداد و مبالغ
            - ذخیره زبان انتخاب‌شده برای اجراهای بعدی
            - نام دوزبانه برنامه در فهرست برنامه‌ها

            ### تغییرات مهم
            - رفع خطای ساخت پروژه و فعال‌سازی `BuildConfig`
            - پشتیبانی از ارقام فارسی در مبلغ‌ها و تاریخ‌ها
            - اعتبارسنجی تاریخ شمسی و شروع هفته از شنبه
            - تأییدیه حذف، ویرایش رکوردها و مدیریت ارتباط خدمات
            - اصلاح کنتراست تم تیره/روشن و راست‌چین کردن رابط
            - افزودن آیکون برنامه و خروجی پشتیبان CSV
            - ساخت و امضای خودکار APK با نام و نسخه در فایل خروجی
          files: release-files/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
