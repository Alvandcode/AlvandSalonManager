name: Android APK and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Read app version
        id: version
        shell: bash
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release_version=${VERSION}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Prepare versioned APK
        shell: bash
        run: |
          mkdir -p release-files
          cp app/build/outputs/apk/debug/app-debug.apk "release-files/AlvandSalonManager-v${{ steps.version.outputs.release_version }}-Android.apk"
          cp README.md "release-files/AlvandSalonManager-v${{ steps.version.outputs.release_version }}-README.md"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlvandSalonManager-v${{ steps.version.outputs.release_version }}
          path: release-files/*
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.release_version }}
          name: Alvand Salon Manager v${{ steps.version.outputs.release_version }}
          generate_release_notes: true
          files: release-files/*
